<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Erasezo — Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head"><div class="logo">L</div><div><b>Erasezo</b><span>Your account</span></div></div>
    <div class="body">
      <h2 id="title">Sign in to Erasezo</h2>
      <p class="sub" id="sub">Manage your account, plan and credits.</p>
      <label>Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
      <div class="msg" id="msg"></div>
      <button class="btn" id="submit">Sign in</button>
      <div class="or">OR</div>
      <a class="google" href="/api/auth/google">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-7.6l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4 5.5l6.3 5.3C41.8 35.9 44 30.4 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
        Continue with Google
      </a>
      <div class="foot"><span id="ftext">New to Erasezo? </span><button class="link" id="toggle">Create an account</button></div>
    </div>
  </div>
</div>
<script>
(function(){
  var mode="signin";
  var $=function(id){return document.getElementById(id);};
  function setMode(m){ mode=m;
    $("title").textContent = m==="signup"?"Create your account":"Sign in to Erasezo";
    $("submit").textContent = m==="signup"?"Create account":"Sign in";
    $("ftext").textContent = m==="signup"?"Already have an account? ":"New to Erasezo? ";
    $("toggle").textContent = m==="signup"?"Sign in":"Create an account";
    $("password").autocomplete = m==="signup"?"new-password":"current-password";
  }
  function msg(t,ok){ var e=$("msg"); e.textContent=t; e.className="msg "+(ok?"ok":"err"); }
  $("toggle").onclick=function(){ setMode(mode==="signup"?"signin":"signup"); $("msg").className="msg"; };
  $("submit").onclick=function(){
    var email=$("email").value.trim(), password=$("password").value;
    if(!email||!password){ msg("Enter email and password."); return; }
    $("submit").disabled=true;
    fetch("/api/auth/"+(mode==="signup"?"register":"login"),{
      method:"POST", headers:{"Content-Type":"application/json"}, credentials:"include",
      body:JSON.stringify({email:email,password:password})
    }).then(function(r){return r.json().then(function(b){return {ok:r.ok,b:b};});})
    .then(function(x){
      if(x.ok){ location.href="/dashboard"; return; }
      var m={invalid_credentials:"Wrong email or password.",email_taken:"An account with this email already exists.",weak_password:"Password must be at least 8 characters."}[x.b.error]||x.b.message||"Failed.";
      msg(m); $("submit").disabled=false;
    }).catch(function(e){ msg("Network error."); $("submit").disabled=false; });
  };
  // already signed in? go to dashboard
  fetch("/api/me",{credentials:"include"}).then(function(r){ if(r.ok) location.href="/dashboard"; });
})();
</script>
</body>
</html>
