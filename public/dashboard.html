<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Erasezo — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="app-body">
<div class="app">
  <aside id="side">
    <div class="brand">
      <div class="logo">E</div>
      <div><b>Erasezo</b><span>Your account</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="who" id="sideWho"></div>
      <button class="linkbtn" id="signout">Sign out</button>
    </div>
  </aside>

  <main>
    <header class="topbar">
      <button class="iconbtn" id="menuBtn" aria-label="Menu" aria-expanded="false">☰</button>
      <h1 id="viewTitle">Overview</h1>
      <span class="pill" id="planPill">…</span>
      <div class="spacer"></div>
      <a class="btn-sm ghost" href="/admin" id="adminLink" hidden>Control Room</a>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast"></div>

<script src="/dashboard.js"></script>
</body>
</html>
