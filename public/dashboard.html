<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Erasezo — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="logo">L</div><b>Erasezo</b>
    <span class="pill" id="planPill">…</span>
    <div class="spacer"></div>
    <button class="btn ghost" style="width:auto;margin:0;padding:8px 14px" id="signout">Sign out</button>
  </div>
  <div class="hi" id="hi">Loading…</div>
  <div class="muted" id="creditline" style="margin:0 4px 6px"></div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-t="profile">Profile</button>
    <button class="tab" data-t="security">Security</button>
    <button class="tab" data-t="subscription">Subscription</button>
    <button class="tab" data-t="referral">Refer &amp; Earn</button>
  </div>
  <div id="panel" class="grid"></div>
</div>

<script>
(function(){
  var me=null;
  var $=function(id){return document.getElementById(id);};
  function api(path,opts){ return fetch(path,Object.assign({credentials:"include"},opts||{})); }

  function load(){
    api("/api/me").then(function(r){ if(!r.ok){ location.href="/"; return null; } return r.json(); })
    .then(function(u){ if(!u) return; me=u; render(); });
  }
  function render(){
    $("planPill").textContent = (me.plan||"free").toUpperCase();
    $("hi").textContent = "Welcome, "+(me.username||me.email.split("@")[0])+" 👋";
    $("creditline").textContent = "Credits today: "+me.credits.today+" / "+me.credits.dailyQuota+" free · Total balance: "+me.credits.total;
    tab(current);
  }
  var current="profile";
  Array.prototype.forEach.call(document.querySelectorAll(".tab"),function(b){
    b.onclick=function(){ current=b.dataset.t;
      document.querySelectorAll(".tab").forEach(function(x){x.classList.toggle("on",x===b);}); tab(current); };
  });

  function panel(html){ $("panel").innerHTML="<div class='panel'>"+html+"</div>"; }
  function tab(t){
    if(t==="profile") return renderProfile();
    if(t==="security") return renderSecurity();
    if(t==="subscription") return renderSubscription();
    if(t==="referral") return renderReferral();
  }

  function renderProfile(){
    panel(
      "<h3>Profile</h3>"+
      "<div class='kv'><span>Email</span><b>"+esc(me.email)+"</b></div>"+
      "<label>Username</label><input id='uname' value=\""+esc(me.username||"")+"\">"+
      "<div class='msg' id='pmsg'></div>"+
      "<button class='btn' id='psave' style='max-width:180px'>Save changes</button>"+
      "<p class='muted' style='margin-top:10px'>Email is read-only and cannot be changed.</p>"
    );
    $("psave").onclick=function(){
      var v=$("uname").value.trim(); if(!v){ pmsg("Enter a username."); return; }
      $("psave").disabled=true;
      api("/api/user/profile",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:v})})
      .then(function(r){return r.json().then(function(b){return{ok:r.ok,b:b};});})
      .then(function(x){ $("psave").disabled=false; if(x.ok){ me=x.b; pmsg("Saved.",true); $("hi").textContent="Welcome, "+(me.username||me.email.split("@")[0])+" 👋"; } else pmsg("Save failed."); });
    };
  }
  function pmsg(t,ok){ var e=$("pmsg"); if(e){ e.textContent=t; e.className="msg "+(ok?"ok":"err"); } }

  function renderSecurity(){
    if(me.authProvider==="google"){
      panel("<h3>Security</h3><p>Your account uses Google sign-in. Password management is not available for OAuth-only accounts.</p>");
      return;
    }
    panel(
      "<h3>Change password</h3>"+
      "<label>Current password</label><input id='cur' type='password'>"+
      "<label>New password</label><input id='n1' type='password'>"+
      "<label>Confirm new password</label><input id='n2' type='password'>"+
      "<div class='msg' id='smsg'></div>"+
      "<button class='btn' id='ssave' style='max-width:200px'>Update password</button>"
    );
    $("ssave").onclick=function(){
      var cur=$("cur").value, n1=$("n1").value, n2=$("n2").value;
      var e=$("smsg");
      if(n1.length<8){ e.textContent="New password must be at least 8 characters."; e.className="msg err"; return; }
      if(n1!==n2){ e.textContent="Passwords do not match."; e.className="msg err"; return; }
      $("ssave").disabled=true;
      api("/api/user/password",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({currentPassword:cur,newPassword:n1})})
      .then(function(r){return r.json().then(function(b){return{ok:r.ok,b:b};});})
      .then(function(x){ $("ssave").disabled=false; if(x.ok){ e.textContent="Password updated."; e.className="msg ok"; } else { e.textContent=x.b.message||"Failed."; e.className="msg err"; } });
    };
  }

  function renderSubscription(){
    if(me.subscriptionStatus==="active"){
      panel("<h3>Subscription</h3><div class='kv'><span>Plan</span><b>"+esc(me.plan)+"</b></div><div class='kv'><span>Status</span><b>Active</b></div>");
    } else {
      panel("<h3>Subscription</h3><p>You don't have an active subscription.</p><a class='btn' style='max-width:160px;display:inline-block;text-align:center;text-decoration:none' href='/pricing'>View plans →</a>");
    }
  }

  function renderReferral(){
    if(me.referralCode){
      var link=location.origin+"/signup?ref="+me.referralCode;
      panel("<h3>Refer &amp; Earn</h3><p>Share your link and earn credits.</p><div class='kv'><span>Your link</span><b style='word-break:break-all'>"+esc(link)+"</b></div>");
    } else {
      panel("<h3>Refer &amp; Earn</h3><p>Request access to get your referral link and earn credits per signup.</p><button class='btn' id='refreq' style='max-width:220px'>Request Referral Access</button><div class='msg' id='rmsg'></div>");
      var b=$("refreq"); if(b) b.onclick=function(){ $("rmsg").textContent="Referral endpoint is Part 2 — pending backend wiring."; $("rmsg").className="msg err"; };
    }
  }

  function esc(s){ return String(s==null?"":s).replace(/[&<>\"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
  $("signout").onclick=function(){ api("/api/auth/logout",{method:"POST"}).then(function(){ location.href="/"; }); };
  load();
})();
</script>
</body>
</html>
