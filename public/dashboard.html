<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Erasezo — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="logo">L</div><b>Erasezo</b>
    <span class="pill" id="planPill">…</span>
    <div class="spacer"></div>
    <button class="btn ghost" style="width:auto;margin:0;padding:8px 14px" id="signout">Sign out</button>
  </div>
  <div class="hi" id="hi">Loading…</div>
  <div class="muted" id="creditline" style="margin:0 4px 6px"></div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-t="profile">Profile</button>
    <button class="tab" data-t="security">Security</button>
    <button class="tab" data-t="subscription">Subscription</button>
    <button class="tab" data-t="referral">Refer &amp; Earn</button>
  </div>
  <div id="panel" class="grid"></div>
</div>

<script src="/dashboard.js"></script>
</body>
</html>
